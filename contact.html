    <main class="container">
        <div class="card">
            <h2>تواصل معنا</h2>
            <p>نحن هنا للرد على استفساراتكم ومقترحاتكم طوال اليوم.</p>
            <form onsubmit="event.preventDefault(); alert('تم إرسال رسالتك بنجاح، شكراً لتواصلك معنا!');">
                <div class="form-group">
                    <label for="name">الاسم:</label>
                    <input type="text" id="name" placeholder="أدخل اسمك" required>
                </div>
                <div class="form-group">
                    <label for="msg">الرسالة:</label>
                    <textarea id="msg" rows="4" placeholder="اكتب رسالتك هنا..." required></textarea>
                </div>
                <button type="submit" class="btn">إرسال الرسالة</button>
            </form>
        </div>
    </main>

    <footer>
        <p>جميع الحقوق محفوظة &copy; 2026 تطبيق وصلني</p>
    </footer>
