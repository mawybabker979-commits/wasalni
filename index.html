    <main class="container">
        <div class="card">
            <h2>مرحباً بك في وصلني</h2>
            <p>سجل دخولك الآن لطلب رحلتك بكل سهولة وأمان.</p>
            <form onsubmit="event.preventDefault(); alert('تم تسجيل الدخول بنجاح!');">
                <div class="form-group">
                    <label for="phone">رقم الهاتف:</label>
                    <input type="text" id="phone" placeholder="أدخل رقم هاتفك" required>
                </div>
                <div class="form-group">
                    <label for="password">كلمة المرور:</label>
                    <input type="password" id="password" placeholder="أدخل كلمة المرور" required>
                </div>
                <button type="submit" class="btn">دخول</button>
            </form>
        </div>
    </main>

    <footer>
        <p>جميع الحقوق محفوظة &copy; 2026 تطبيق وصلني</p>
