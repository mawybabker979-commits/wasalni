<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>وصلني - تسجيل الدخول</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <nav class="navbar">
            <a href="index.html" class="logo">🚖 <span>وصلني</span></a>
            <ul class="nav-links">
                <li><a href="index.html" class="active">تسجيل الدخول</a></li>
                <li><a href="about.html">السيارات المتاحة</a></li>
                <li><a href="map.html">الخريطة</a></li>
                <li><a href="contact.html">تواصل معنا</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <div style="max-width: 450px; margin: 1rem auto;" class="card">
            
            <div class="auth-tabs">
                <button class="tab-btn active">تسجيل الدخول</button>
                <button class="tab-btn">إنشاء حساب جديد</button>
            </div>

            <!-- نموذج الدخول / إنشاء الحساب -->
            <form action="about.html" method="GET">
                <div class="form-group">
                    <label for="username">الاسم الكامل / البريد الإلكتروني</label>
                    <input type="text" id="username" placeholder="أدخل البريد أو اسم المستخدم" required>
                </div>

                <div class="form-group">
                    <label for="phone">رقم الهاتف</label>
                    <input type="tel" id="phone" placeholder="0912345678" required>
                </div>

                <div class="form-group">
                    <label for="password">كلمة المرور</label>
                    <input type="password" id="password" placeholder="أدخل كلمة المرور" required>
                </div>

                <!-- زر التسجيل والدخول يقود مباشرة للصفحة التالية about.html -->
                <button type="submit" class="btn">تسجيل الدخول والانتفال للخدمات ➔</button>
            </form>
        </div>
    </div>

    <footer>
        <p>جميع الحقوق محفوظة &copy; 2026 - تطبيق وصلني</p>
    </footer>

</body>
</html>
